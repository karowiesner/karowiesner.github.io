---
layout: default
---
<header class="page-head">
  <div class="wrap">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="wrap page-body">
  {{ content }}
</div>
